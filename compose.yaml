services:
  symphony:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    command:
      - ${SYMPHONY_ACKNOWLEDGEMENT:-}
      - --logs-root
      - /data/logs
      - --port
      - "4000"
      - /config/WORKFLOW.md
    ports:
      - "${SYMPHONY_PORT:-4000}:4000"
    volumes:
      - type: bind
        source: ./docker/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - ./data/workspaces:/data/workspaces
      - ./data/logs:/data/logs
      - ./data/codex:/home/symphony/.codex
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:4000/api/v1/state]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
